# Defaults shared by every cut.  CLI flags override these.
seed: 42
img_size: 384
batch_size: 16
epochs: 30
lr: 1.0e-4
weight_decay: 1.0e-4     # AdamW decoupled L2 (small-data regularization)
patience: 8              # early-stop epochs w/o val-macro-F1 gain (0=off)
n_splits: 5
test_ratio: 0.2
# Training uses class-weighted cross-entropy (sklearn-'balanced' per fold).
# Augmentation: mild affine + brightness/contrast jitter, NO horizontal flip
# (right hips are pre-flipped to left, so a flip would undo that normalization).

backbones:
  - efficientnet_b0
  - efficientnet_b1
  - resnet50
  - convnext_tiny
  - convnext_small
  - densenet121
  - densenet169

normalize:
  mean: [0.5, 0.5, 0.5]
  std:  [0.5, 0.5, 0.5]
